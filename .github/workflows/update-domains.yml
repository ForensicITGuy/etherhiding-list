name: Update Blockchain RPC Blocklist

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-blocklist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Download and process Chainlist RPCs
        run: python3 update_domains.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domains.txt
          if git diff --staged --quiet; then
            echo "No changes to domains.txt"
          else
            git commit -m "chore: update blockchain JSON-RPC domains list"
            git push
          fi
